<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>War Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="licht">
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">WR</span>
        <div>
          <h1>War Room</h1>
          <p id="challenge" class="muted">Documenten delen &amp; samenvatten</p>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap smal-wrap">
    <!-- UPLOAD -->
    <section class="upload-kaart">
      <div id="geen-toegang" class="melding" hidden>
        Om te uploaden heb je de <strong>teamlink</strong> nodig (vraag hem in de groep). Bekijken en downloaden kan altijd.
        <details><summary class="klein">Of plak de teamcode</summary><input id="code" type="password" placeholder="github_pat_…" autocomplete="off"></details>
      </div>

      <div class="wie">
        <input id="naam" placeholder="Je naam" autocomplete="name" aria-label="Je naam">
        <select id="afdeling" aria-label="Afdeling"><option value="">Afdeling…</option></select>
      </div>

      <label id="drop" class="drop" tabindex="0">
        <input id="bestand" type="file" multiple hidden>
        <span class="drop-icoon" aria-hidden="true">⬆</span>
        <strong>Sleep je document hierheen</strong>
        <span class="muted klein">of klik om te kiezen · PDF, Word, PowerPoint, Excel, afbeelding · max 50 MB</span>
      </label>

      <details class="extra">
        <summary class="klein muted">+ notitie of link toevoegen (optioneel)</summary>
        <textarea id="notitie" rows="2" placeholder="Waarom is dit belangrijk? Of plak alleen een link en klik op Versturen."></textarea>
        <button id="alleen-tekst" class="knop secundair klein-knop" type="button">Versturen zonder bestand</button>
      </details>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <!-- LIJST -->
    <section>
      <div class="lijst-balk">
        <input type="search" id="zoek" placeholder="Zoeken…" aria-label="Zoeken">
        <select id="filter-afd" aria-label="Filter op afdeling"><option value="">Alle afdelingen</option></select>
      </div>
      <div id="lijst" class="docs"></div>
    </section>
  </main>

  <script src="licht.js"></script>
</body>
</html>
