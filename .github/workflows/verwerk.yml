name: Inzendingen verwerken en site publiceren

on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/verwerk.yml"
  workflow_dispatch:
    inputs:
      herstel:
        description: "Items zonder AI-samenvatting alsnog laten samenvatten"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Eén run tegelijk; nieuwe inzendingen wachten netjes op hun beurt.
concurrency:
  group: war-room
  cancel-in-progress: false

jobs:
  verwerk:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # altijd de nieuwste versie, ook als deze run in de wachtrij stond

      # VEILIGHEID: de teamcode mag bestanden in de repo aanpassen, maar niet dit workflowbestand.
      # Daarom staat hier de vingerafdruk van de code die met de geheimen draait. Is het script
      # aangepast (door wie dan ook), dan stopt de run en ziet die code de Claude-token nooit.
      # Script bewust gewijzigd? Werk dan de hashes hieronder bij:
      #   git show :scripts/verwerk_inbox.py | sha256sum
      - name: Vingerafdruk van het verwerkscript controleren
        run: |
          cat > /tmp/vertrouwd.sha256 <<'EOF'
          7bc292cfd713ebf28b5119f137ade4128572989049363ec732b616b551d1514a  scripts/verwerk_inbox.py
          53f9702d7ef7f510c377b6f03757e681996791ba533595a5baee3fb420280e0f  scripts/requirements.txt
          EOF
          sha256sum -c /tmp/vertrouwd.sha256

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Claude Code installeren
        run: npm install -g @anthropic-ai/claude-code

      - name: Inbox verwerken (samenvatten + sorteren)
        # De geheimen zijn ALLEEN in deze stap beschikbaar, niet tijdens het installeren.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -I: Python laadt geen modules uit de repo-map (geen nep-'json.py' e.d.)
        run: python -I scripts/verwerk_inbox.py ${{ inputs.herstel && '--herstel' || '' }}

      - name: Resultaat opslaan in de repo
        run: |
          git config user.name "war-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Niets nieuws om op te slaan."
          else
            git commit -m "Inzendingen verwerkt"
            # Kwam er tijdens deze run een nieuwe inzending binnen? Eerst bijwerken.
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
